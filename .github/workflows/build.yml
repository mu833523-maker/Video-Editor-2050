name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project code
        run: |
          cp "google-services (11).json" /tmp/gs.json
          mkdir tmp_unzip
          unzip -q -o video-editor-2050-*.zip -d tmp_unzip
          if [ "$(ls tmp_unzip | wc -l)" -eq 1 ] && [ -d "tmp_unzip/$(ls tmp_unzip)" ]; then
            cp -a "tmp_unzip/$(ls tmp_unzip)/." .
          else
            cp -a tmp_unzip/. .
          fi
          mkdir -p app
          cp /tmp/gs.json app/google-services.json
          ls -la
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore fixed debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Print Keystore SHA-1 and SHA-256
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
